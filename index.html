<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin-top: 8px;
      color: #777;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-image {
      width: 100%;
      height: 130px;
      background: #eee;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 10px;
    }

    .card-name {
      font-weight: bold;
      font-size: 17px;
    }

    .preview {
      display: none;
      margin-top: 25px;
    }

    .preview-box {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.1);
    }

    .preview-image {
      width: 100%;
      height: 220px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .preview-content {
      padding: 20px;
    }

    .preview-content h2 {
      margin-top: 0;
    }

    .preview-content p {
      color: #666;
      line-height: 1.6;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .send-btn {
      background: #06c755;
      color: white;
    }

    .close-btn {
      background: #eee;
      color: #333;
    }
  </style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>

<body>

<div class="container">

  <div class="header">
    <h1>📤 Friend Card</h1>
    <p>เลือกการ์ดที่ต้องการส่ง</p>
  </div>

  <div class="cards">

    <div class="card" onclick="showCard(1)">
      <div class="card-image">🟦</div>
      <div class="card-name">Card 1</div>
    </div>

    <div class="card" onclick="showCard(2)">
      <div class="card-image">🟩</div>
      <div class="card-name">Card 2</div>
    </div>

    <div class="card" onclick="showCard(3)">
      <div class="card-image">🟨</div>
      <div class="card-name">Card 3</div>
    </div>

    <div class="card" onclick="showCard(4)">
      <div class="card-image">🟪</div>
      <div class="card-name">Card 4</div>
    </div>

    <div class="card" onclick="showCard(5)">
      <div class="card-image">🟥</div>
      <div class="card-name">Card 5</div>
    </div>

    <div class="card" onclick="showCard(6)">
      <div class="card-image">⬜</div>
      <div class="card-name">Card 6</div>
    </div>

    <div class="card" onclick="showCard(7)">
      <div class="card-image">🟧</div>
      <div class="card-name">Card 7</div>
    </div>

    <div class="card" onclick="showCard(8)">
      <div class="card-image">🟫</div>
      <div class="card-name">Card 8</div>
    </div>

    <div class="card" onclick="showCard(9)">
      <div class="card-image">🔵</div>
      <div class="card-name">Card 9</div>
    </div>

    <div class="card" onclick="showCard(10)">
      <div class="card-image">🔴</div>
      <div class="card-name">Card 10</div>
    </div>

  </div>

  <div class="preview" id="preview">

    <div class="preview-box">

      <div class="preview-image" id="previewImage">
        🖼️
      </div>

      <div class="preview-content">

        <h2 id="previewTitle">
          หัวข้อการ์ด
        </h2>

        <p id="previewText">
          ข้อความสั้น ๆ ของการ์ด
        </p>

        <button class="btn send-btn" onclick="sendCard()">
          📤 ส่งการ์ดนี้
        </button>

        <button class="btn close-btn" onclick="closePreview()">
          ปิด
        </button>

      </div>

    </div>

  </div>

</div>

<script>

const LIFF_ID = "2011088879-uJOA8rZe";

let selectedCard = null;

  window.addEventListener("load", async () => {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    console.log("LIFF initialized");

  } catch (error) {

    console.error("LIFF initialization failed:", error);

  }

});

function showCard(cardNumber) {

  selectedCard = cardNumber;

  document.getElementById("preview").style.display = "block";

  document.getElementById("previewTitle").innerText =
    "Card " + cardNumber;

  document.getElementById("previewText").innerText =
    "นี่คือตัวอย่างข้อความของ Card " + cardNumber;

  document.getElementById("previewImage").innerText =
    "🖼️";

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

async function sendCard() {

  if (!selectedCard) {
    alert("กรุณาเลือกการ์ดก่อน");
    return;
  }

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  try {

    await liff.shareTargetPicker([
      {
        type: "flex",
        altText: "คุณได้รับการ์ดจากเรา",
        contents: {

          type: "bubble",

          hero: {
            type: "image",
            url: "https://placehold.co/800x500/png",
            size: "full",
            aspectRatio: "8:5",
            aspectMode: "cover"
          },

          body: {
            type: "box",
            layout: "vertical",
            spacing: "md",

            contents: [

              {
                type: "text",
                text: "🎉 หัวข้อ Card 1",
                weight: "bold",
                size: "xl",
                wrap: true
              },

              {
                type: "text",
                text: "นี่คือข้อความตัวอย่างของการ์ด เราจะเปลี่ยนเป็นข้อความจริงภายหลัง",
                size: "md",
                color: "#666666",
                wrap: true
              }

            ]
          },

          footer: {
            type: "box",
            layout: "vertical",
            spacing: "sm",

            contents: [

              {
                type: "button",
                style: "primary",
                action: {
                  type: "uri",
                  label: "สมัครเลย",
                  uri: "https://example.com"
                }
              },

              {
                type: "button",
                style: "secondary",
                action: {
                  type: "uri",
                  label: "ติดต่อเรา",
                  uri: "https://example.com"
                }
              }

            ]
          }

        }
      }
    ]);

    alert("ส่งการ์ดสำเร็จแล้ว");

  } catch (error) {

    console.error(error);
    alert("ไม่สามารถส่งการ์ดได้");

  }

}

  async function sendCard() {

  if (!selectedCard) {
    alert("กรุณาเลือกการ์ดก่อน");
    return;
  }

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  try {

    await liff.shareTargetPicker([
      {
        type: "flex",
        altText: "คุณได้รับการ์ดจากเรา",
        contents: {
          type: "bubble",

          hero: {
            type: "image",
            url: "https://placehold.co/800x500/png",
            size: "full",
            aspectRatio: "8:5",
            aspectMode: "cover"
          },

          body: {
            type: "box",
            layout: "vertical",
            spacing: "md",
            contents: [
              {
                type: "text",
                text: "🎉 หัวข้อ Card 1",
                weight: "bold",
                size: "xl",
                wrap: true
              },
              {
                type: "text",
                text: "นี่คือข้อความตัวอย่างของการ์ด",
                size: "md",
                color: "#666666",
                wrap: true
              }
            ]
          },

          footer: {
            type: "box",
            layout: "vertical",
            spacing: "sm",
            contents: [
              {
                type: "button",
                style: "primary",
                action: {
                  type: "uri",
                  label: "สมัครเลย",
                  uri: "https://example.com"
                }
              },
              {
                type: "button",
                style: "secondary",
                action: {
                  type: "uri",
                  label: "ติดต่อเรา",
                  uri: "https://example.com"
                }
              }
            ]
          }
        }
      }
    ]);

    alert("ส่งการ์ดสำเร็จแล้ว");

  } catch (error) {

    console.error(error);
    alert("ไม่สามารถส่งการ์ดได้");

  }

}
</script>

</body>
</html>
