.contact {

.send-info {

.stat {

let selectedCard = null;

/*

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    renderCards();

    await initLIFF();

  }
);


/*
=========================================================
  LIFF
=========================================================
*/


async function initLIFF() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "ไม่พบ ID Token"
      );

    }


    await fetchMe();


    await loadDashboard();


    document
      .getElementById("status")
      .textContent =
        "เชื่อมต่อ LINE แล้ว ✓";


  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "ไม่สามารถเชื่อมต่อ LINE ได้",
      "error"
    );

    document
      .getElementById("status")
      .textContent =
        "เชื่อมต่อไม่สำเร็จ";

  }

}


/*
=========================================================
  REGISTER USER
=========================================================
*/


async function fetchMe() {

  const response =
    await fetch(
      `${API_URL}/api/me`,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          idToken
        })

      }
    );


  const data =
    await response.json();


  if (!data.ok) {

    throw new Error(
      data.error ||
      "ไม่สามารถลงทะเบียนผู้ใช้"
    );

  }

}


/*
=========================================================
  RENDER CARDS
=========================================================
*/


function renderCards() {

  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML = "";


  cards.forEach(card => {

    const element =
      document.createElement(
        "div"
      );


    element.className =
      "card";


    element.dataset.id =
      card.id;


    element.innerHTML = `

      <div class="check">
        ✓
      </div>

      <img
        src="${card.images[0]}"
        alt=""
      >

      <div class="card-body">

        <div class="card-number">
          CARD ${card.id}
        </div>

        <div class="card-title">
          ${escapeHtml(card.title)}
        </div>

        <div class="card-description">
          ${escapeHtml(card.description)}
        </div>

      </div>

    `;


    element.onclick =
      () => selectCard(card.id);


    grid.appendChild(element);

  });

}


/*
=========================================================
  SELECT
=========================================================
*/


function selectCard(id) {

  selectedCard =
    cards.find(
      card => card.id === id
    );


  if (!selectedCard) {
    return;
  }


  document
    .querySelectorAll(".card")
    .forEach(card => {

      card.classList.remove(
        "selected"
      );

    });


  const element =
    document.querySelector(
      `.card[data-id="${id}"]`
    );


  if (element) {

    element.classList.add(
      "selected"
    );

  }


  document
    .getElementById("sendInfo")
    .textContent =
      `เลือก ${selectedCard.title} แล้ว`;


  document
    .getElementById("sendButton")
    .disabled = false;


  document
    .getElementById("sendButton")
    .textContent =
      `📤 ส่ง ${selectedCard.title}`;


  renderPreview(
    selectedCard
  );


  document
    .getElementById("preview")
    .scrollIntoView({
      behavior: "smooth"
    });

}


/*
=========================================================
  PREVIEW
=========================================================
*/


function renderPreview(card) {

  const box =
    document.getElementById(
      "previewBox"
    );


  const images =
    card.images
      .slice(0, 2)
      .map(
        image =>
          `<img
             class="preview-image"
             src="${image}"
             alt=""
           >`
      )
      .join("");


  box.innerHTML = `

    ${images}

    <div class="preview-body">

      <h2>
        ${escapeHtml(card.title)}
      </h2>

      <p>
        ${escapeHtml(card.description)}
      </p>

    </div>

    <div class="preview-buttons">

      <button
        class="apply"
        onclick="openUrl('${escapeJs(card.applyUrl)}')"
      >
        ${escapeHtml(card.applyText)}
      </button>

      <button
        class="contact"
        onclick="openUrl('${escapeJs(card.contactUrl)}')"
      >
        ${escapeHtml(card.contactText)}
      </button>

    </div>

  `;


  document
    .getElementById("preview")
    .classList.add("show");

}


/*
=========================================================
  CREATE TOKEN
=========================================================
*/


async function createShareToken() {

  const response =
    await fetch(
      `${API_URL}/api/share`,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          idToken,

          cardId:
            selectedCard.id

        })

      }
    );


  const data =
    await response.json();


  if (!data.ok) {

    throw new Error(
      data.error ||
      "สร้าง Token ไม่สำเร็จ"
    );

  }


  return data;

}


/*
=========================================================
  SEND
=========================================================
*/


async function sendCard() {

  if (!selectedCard) {

    showMessage(
      "กรุณาเลือกการ์ดก่อน",
      "error"
    );

    return;

  }


  if (
    !liff.isApiAvailable(
      "shareTargetPicker"
    )
  ) {

    showMessage(
      "Share Target Picker ยังไม่พร้อมใช้งาน",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "sendButton"
    );


  button.disabled = true;

  button.textContent =
    "กำลังเตรียมการ์ด...";


  try {

    /*
    ---------------------------------------------------------
      สร้าง Token ก่อนส่ง
    ---------------------------------------------------------
    */

    const share =
      await createShareToken();


    /*
    ---------------------------------------------------------
      Flex
    ---------------------------------------------------------
    */

    const flex =
      createFlex(
        selectedCard,
        share.openUrl
      );


    /*
    ---------------------------------------------------------
      เปิด Target Picker
    ---------------------------------------------------------
    */

    const result =
      await liff.shareTargetPicker(
        [flex],
        {
          isMultiple: false
        }
      );


    if (result) {

      showMessage(
        `ส่ง ${selectedCard.title} สำเร็จแล้ว 📤`,
        "success"
      );


      await loadDashboard();


    } else {

      showMessage(
        "ยกเลิกการส่ง",
        "error"
      );

    }


  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "ส่งการ์ดไม่สำเร็จ",
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    `📤 ส่ง ${selectedCard.title}`;

}


/*
=========================================================
  CREATE FLEX
=========================================================
*/


function createFlex(
  card,
  openUrl
) {

  const imageContents =
    card.images
      .slice(0, 2)
      .map(
        image => ({

          type:
            "image",

          url:
            image,

          size:
            "full",

          aspectRatio:
            "16:9",

          aspectMode:
            "cover"

        })
      );


  return {

    type:
      "flex",

    altText:
      card.title,

    contents: {

      type:
        "bubble",

      size:
        "mega",


      body: {

        type:
          "box",

        layout:
          "vertical",

        paddingAll:
          "0",

        contents: [

          ...imageContents,


          {

            type:
              "box",

            layout:
              "vertical",

            paddingAll:
              "18px",

            contents: [

              {

                type:
                  "text",

                text:
                  card.title,

                weight:
                  "bold",

                size:
                  "xl",

                wrap:
                  true

              },


              {

                type:
                  "text",

                text:
                  card.description,

                color:
                  "#666666",

                wrap:
                  true,

                margin:
                  "md"

              }

            ]

          }

        ]

      },


      footer: {

        type:
          "box",

        layout:
          "vertical",

        spacing:
          "sm",

        paddingAll:
          "15px",

        contents: [

          {

            type:
              "button",

            style:
              "primary",

            color:
              "#06C755",

            action: {

              type:
                "uri",

              label:
                card.applyText,

              uri:
                card.applyUrl

            }

          },


          {

            type:
              "button",

            style:
              "secondary",

            action: {

              type:
                "uri",

              label:
                card.contactText,

              uri:
                card.contactUrl

            }

          },


          {

            type:
              "button",

            style:
              "link",

            action: {

              type:
                "uri",

              label:
                "ดูการ์ด",

              uri:
                openUrl

            }

          }

        ]

      }

    }

  };

}


/*
=========================================================
  DASHBOARD
=========================================================
*/


async function loadDashboard() {

  if (!idToken) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API_URL}/api/dashboard`,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({
              idToken
            })

        }
      );


    const data =
      await response.json();


    if (!data.ok) {
      return;
    }


    renderDashboard(
      data.cards
    );


  } catch (error) {

    console.error(
      "Dashboard error:",
      error
    );

  }

}


/*
=========================================================
  RENDER DASHBOARD
=========================================================
*/


function renderDashboard(
  stats
) {

  const element =
    document.getElementById(
      "stats"
    );


  element.innerHTML = "";


  stats.forEach(stat => {

    const box =
      document.createElement(
        "div"
      );


    box.style.marginBottom =
      "14px";


    box.innerHTML = `

      <div
        style="
          font-weight:800;
          margin-bottom:7px;
        "
      >
        Card ${stat.cardId}
      </div>

      <div class="stats">

        <div class="stat">

          <strong>
            ${stat.sent}
          </strong>

          <span>
            📤 ส่งแล้ว
          </span>

        </div>


        <div class="stat">

          <strong>
            ${stat.opened}
          </strong>

          <span>
            ✅ เปิดแล้ว
          </span>

        </div>


        <div class="stat">

          <strong>
            ${stat.notOpened}
          </strong>

          <span>
            ⏳ ยังไม่เปิด
          </span>

        </div>

      </div>

    `;


    element.appendChild(
      box
    );

  });

}


/*
=========================================================
  URL
=========================================================
*/


function openUrl(url) {

  window.open(
    url,
    "_blank"
  );

}


/*
=========================================================
  MESSAGE
=========================================================
*/


function showMessage(
  text,
  type
) {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    text;


  element.className =
    `message show ${type}`;

}


/*
=========================================================
  ESCAPE
=========================================================
*/


function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(
  value
) {

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /\n/g,
      "\\n"
    )

    .replace(
      /\r/g,
      "\\r"
    );

}
