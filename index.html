<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Friend Card</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: #06c755;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      max-width: 950px;
      margin: auto;
      padding: 20px;
    }

    /* =========================
       CARD GRID
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: #ddd;
    }

    .card-content {
      padding: 14px;
    }

    .card-number {
      font-size: 12px;
      color: #888;
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .send-count {
      color: #06c755;
      font-size: 13px;
      font-weight: bold;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

    /*

    🔢 ระบบเก็บจำนวนการส่ง
    ==================================================
    */


    const COUNT_KEY =
      "friend_card_counts_v1";


    function getCounts() {

      try {

        return JSON.parse(
          localStorage.getItem(COUNT_KEY) || "{}"
        );

      }

      catch (error) {

        return {};

      }

    }


    /*
    ==================================================
    🎴 แสดงการ์ด
    ==================================================
    */


    function renderCards() {

      const grid =
        document.getElementById(
          "cardGrid"
        );


      const counts =
        getCounts();


      grid.innerHTML = "";


      cards.forEach(card => {


        const count =
          Number(
            counts[card.id] || 0
          );


        const element =
          document.createElement(
            "div"
          );


        element.className =
          "card";


        element.innerHTML = `

          <img
            class="card-image"
            src="${card.images[0]}"
            alt="Card ${card.id}"
          >

          <div class="card-content">

            <div class="card-number">
              CARD ${card.id}
            </div>

            <div class="card-title">
              ${card.title}
            </div>

            <div class="send-count">
              👥 ส่งแล้ว ${count} คน
            </div>

          </div>

        `;


        element.addEventListener(
          "click",
          function() {

            openCard(card.id);

          }
        );


        grid.appendChild(
          element
        );

      });

    }


    /*
    ==================================================
    👆 กด Card
    ==================================================
    */

    function openCard(cardId) {

      alert(
        "เลือก Card " +
        cardId +
        " แล้ว"
      );

    }


    /*
    ==================================================
    🚀 เริ่มระบบ
    ==================================================
    */

    renderCards();
