<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Friend Card</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 18px 14px 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
      color: #777;
    }

    .status {
      background: white;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
      color: #666;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      border: 2px solid transparent;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: 0.15s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card.selected {
      border-color: #06c755;
      box-shadow: 0 3px 15px rgba(6,199,85,0.20);
    }

    .card-number {
      font-size: 13px;
      color: #06c755;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-description {
      font-size: 14px;
      line-height: 1.5;
      color: #666;
    }

    .selected-text {
      display: none;
      margin-top: 10px;
      font-size: 13px;
      color: #06c755;
      font-weight: 600;
    }

    .card.selected .selected-text {
      display: block;
    }

    .bottom {
      position: sticky;
      bottom: 0;
      padding-top: 15px;
      background: linear-gradient(
        to bottom,
        rgba(245,245,245,0),
        #f5f5f5 20%
      );
    }

    .send-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: #06c755;
      color: white;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6,199,85,0.25);
    }

    .send-button:active {
      transform: scale(0.98);
    }

    .send-button:disabled {
      background: #bdbdbd;
      box-shadow: none;
      cursor: not-allowed;
    }

    .message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: #06a847;
    }

    .message.error {
      color: #d93025;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>เลือกการ์ด</h1>
    <p>เลือกการ์ดที่ต้องการส่งให้เพื่อน</p>
  </div>

  <div class="status" id="status">
    กำลังเชื่อมต่อกับ LINE...
  </div>

  <div class="cards" id="cards"></div>

  <div class="bottom">
    <button
      class="send-button"
      id="sendButton"
      disabled
      onclick="sendSelectedCard()"
    >
      📤 ส่งการ์ดนี้
    </button>

    <div class="message" id="message"></div>
  </div>

</div>


<script>

  /*
   * =========================================================
   * 1. LIFF ID
   * =========================================================
   *
   * เอา LIFF ID จริงของคุณมาใส่ตรงนี้
   *
   * ตัวอย่าง:
   * const LIFF_ID = "1234567890-AbCdEfGh";
   *
   */

  const LIFF_ID = "2011088879-uJOA8rZe";


  /*
   * =========================================================
   * 2. ข้อมูลการ์ดทั้ง 10 ใบ
   * =========================================================
   *
   * ตอนนี้ยังไม่ใส่รูปจริง
   * ตามที่เราคุยกันไว้ เรื่องรูปเอาไว้ทำทีหลัง
   */

  const cards = [
    {
      id: 1,
      title: "Card 1",
      description: "รายละเอียดของการ์ดที่ 1",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 2,
      title: "Card 2",
      description: "รายละเอียดของการ์ดที่ 2",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 3,
      title: "Card 3",
      description: "รายละเอียดของการ์ดที่ 3",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 4,
      title: "Card 4",
      description: "รายละเอียดของการ์ดที่ 4",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 5,
      title: "Card 5",
      description: "รายละเอียดของการ์ดที่ 5",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 6,
      title: "Card 6",
      description: "รายละเอียดของการ์ดที่ 6",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 7,
      title: "Card 7",
      description: "รายละเอียดของการ์ดที่ 7",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 8,
      title: "Card 8",
      description: "รายละเอียดของการ์ดที่ 8",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 9,
      title: "Card 9",
      description: "รายละเอียดของการ์ดที่ 9",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    },

    {
      id: 10,
      title: "Card 10",
      description: "รายละเอียดของการ์ดที่ 10",
      buttonText: "ดูรายละเอียด",
      buttonUrl: "https://lrb053.github.io/MineGuide/"
    }
  ];


  /*
   * =========================================================
   * 3. ตัวแปรระบบ
   * =========================================================
   */

  let selectedCard = null;


  /*
   * =========================================================
   * 4. แสดงการ์ด 10 ใบ
   * =========================================================
   */

  function renderCards() {

    const container = document.getElementById("cards");

    container.innerHTML = "";

    cards.forEach(card => {

      const element = document.createElement("div");

      element.className = "card";

      element.id = `card-${card.id}`;

      element.innerHTML = `
        <div class="card-number">
          CARD ${card.id}
        </div>

        <div class="card-title">
          ${escapeHtml(card.title)}
        </div>

        <div class="card-description">
          ${escapeHtml(card.description)}
        </div>

        <div class="selected-text">
          ✓ เลือกการ์ดนี้แล้ว
        </div>
      `;

      element.addEventListener("click", () => {
        selectCard(card.id);
      });

      container.appendChild(element);

    });
  }


  /*
   * =========================================================
   * 5. เลือกการ์ด
   * =========================================================
   */

  function selectCard(cardId) {

    selectedCard = cards.find(card => card.id === cardId);

    if (!selectedCard) {
      return;
    }

    document.querySelectorAll(".card").forEach(card => {
      card.classList.remove("selected");
    });

    const element = document.getElementById(`card-${cardId}`);

    if (element) {
      element.classList.add("selected");
    }

    const sendButton = document.getElementById("sendButton");

    sendButton.disabled = false;

    sendButton.textContent = `📤 ส่ง ${selectedCard.title}`;

    clearMessage();
  }


  /*
   * =========================================================
   * 6. ส่งการ์ดผ่าน LINE Share Target Picker
   * =========================================================
   */

  async function sendSelectedCard() {

    if (!selectedCard) {

      showMessage(
        "กรุณาเลือกการ์ดก่อน",
        "error"
      );

      return;
    }


    /*
     * ตรวจสอบ LIFF
     */

    if (!liff.isLoggedIn()) {

      try {

        liff.login();

      } catch (error) {

        console.error(error);

        showMessage(
          "ไม่สามารถเข้าสู่ระบบ LINE ได้",
          "error"
        );

      }

      return;
    }


    /*
     * ตรวจสอบ Share Target Picker
     */

    if (!liff.isApiAvailable("shareTargetPicker")) {

      showMessage(
        "Share Target Picker ยังไม่พร้อมใช้งาน กรุณาตรวจสอบการตั้งค่า LIFF ใน LINE Developers",
        "error"
      );

      return;
    }


    /*
     * ปิดปุ่มชั่วคราว
     */

    const sendButton = document.getElementById("sendButton");

    sendButton.disabled = true;

    sendButton.textContent = "กำลังเปิด LINE...";


    try {

      /*
       * สร้าง Flex Message
       */

      const flexMessage = createFlexMessage(selectedCard);


      /*
       * เปิด Share Target Picker
       */

      const result = await liff.shareTargetPicker(
        [
          flexMessage
        ],
        {
          isMultiple: false
        }
      );


      /*
       * สำเร็จ
       */

      if (result) {

        showMessage(
          `ส่ง ${selectedCard.title} สำเร็จแล้ว`,
          "success"
        );

      } else {

        showMessage(
          "ปิดหน้าต่างเลือกผู้รับแล้ว",
          "error"
        );

      }

    } catch (error) {

      console.error("Share Target Picker Error:", error);

      showMessage(
        "ไม่สามารถส่งการ์ดได้ กรุณาลองใหม่อีกครั้ง",
        "error"
      );

    }


    /*
     * เปิดปุ่มกลับมา
     */

    sendButton.disabled = false;

    sendButton.textContent =
      `📤 ส่ง ${selectedCard.title}`;
  }


  /*
   * =========================================================
   * 7. สร้าง Flex Message
   * =========================================================
   */

  function createFlexMessage(card) {

    return {

      type: "flex",

      altText: `${card.title}`,

      contents: {

        type: "bubble",

        size: "mega",

        body: {

          type: "box",

          layout: "vertical",

          spacing: "md",

          contents: [

            {
              type: "text",

              text: card.title,

              weight: "bold",

              size: "xl",

              wrap: true
            },

            {
              type: "text",

              text: card.description,

              size: "md",

              color: "#666666",

              wrap: true
            }

          ]
        },

        footer: {

          type: "box",

          layout: "vertical",

          spacing: "sm",

          contents: [

            {
              type: "button",

              style: "primary",

              color: "#06C755",

              action: {

                type: "uri",

                label: card.buttonText,

                uri: card.buttonUrl

              }
            }

          ]
        }
      }
    };
  }


  /*
   * =========================================================
   * 8. เริ่มต้น LIFF
   * =========================================================
   */

  async function initializeLIFF() {

    const status = document.getElementById("status");

    try {

      /*
       * ตรวจว่าใส่ LIFF ID หรือยัง
       */

      if (
        !LIFF_ID ||
        LIFF_ID === "ใส่-LIFF-ID-ของคุณตรงนี้"
      ) {

        status.textContent =
          "ยังไม่ได้ใส่ LIFF ID";

        return;
      }


      /*
       * เริ่มต้น LIFF
       */

      await liff.init({
        liffId: LIFF_ID
      });


      /*
       * ตรวจ Login
       */

      if (!liff.isLoggedIn()) {

        status.textContent =
          "กำลังเข้าสู่ระบบ LINE...";

        liff.login();

        return;
      }


      /*
       * ตรวจ Share Target Picker
       */

      const shareAvailable =
        liff.isApiAvailable("shareTargetPicker");


      if (shareAvailable) {

        status.textContent =
          "พร้อมใช้งาน ✓";

      } else {

        status.textContent =
          "เชื่อมต่อ LINE แล้ว แต่ Share Target Picker ยังไม่พร้อมใช้งาน";

      }

    } catch (error) {

      console.error("LIFF Init Error:", error);

      status.textContent =
        "เกิดข้อผิดพลาดในการเชื่อมต่อ LINE";

    }
  }


  /*
   * =========================================================
   * 9. ป้องกัน HTML แปลกปลอม
   * =========================================================
   */

  function escapeHtml(text) {

    return String(text)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");
  }


  /*
   * =========================================================
   * 10. Message
   * =========================================================
   */

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      `message show ${type}`;
  }


  function clearMessage() {

    const message =
      document.getElementById("message");

    message.textContent = "";

    message.className = "message";
  }


  /*
   * =========================================================
   * 11. เริ่มระบบ
   * =========================================================
   */

  renderCards();

  initializeLIFF();

</script>

</body>
</html>
