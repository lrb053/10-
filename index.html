<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Friend Card</title>


  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <!-- CARD SETTINGS -->
  <script src="cards.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: #f5f6f8;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      background: #06c755;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }


    .header h1 {
      margin: 0;
      font-size: 25px;
    }


    .header p {
      margin: 7px 0 0;
      font-size: 14px;
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }


    /* =========================
       CARD GRID
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }


    .select-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.15s;
    }


    .select-card:active {
      transform: scale(0.98);
    }


    .select-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #ddd;
    }


    .select-card-content {
      padding: 14px;
    }


    .card-number {
      color: #888;
      font-size: 12px;
      margin-bottom: 5px;
    }


    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
    }


    .card-count {
      color: #06a84f;
      font-size: 13px;
      font-weight: 600;
    }


    /* =========================
       PREVIEW
    ========================= */

    #previewScreen {
      display: none;
    }


    .back-button {
      border: 0;
      background: transparent;
      font-size: 16px;
      padding: 5px 0 15px;
      cursor: pointer;
    }


    .preview-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 15px;
    }


    /* =========================
       MESSAGE CARD
    ========================= */

    .message-card {
      width: 100%;
      max-width: 560px;
      margin: auto;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }


    .preview-images {
      width: 100%;
    }


    /* =========================
       1 รูป
       ========================= */

    .preview-images.one {
      width: 100%;
    }


    .preview-images.one img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      cursor: pointer;
    }


    /* =========================
       2 รูป
       เรียงบน-ล่าง
       ========================= */

    .preview-images.two {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
    }


    .preview-images.two img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      cursor: pointer;
    }


    /* =========================
       IMAGE LINK
    ========================= */

    .image-link {
      display: block;
      width: 100%;
      text-decoration: none;
      line-height: 0;
    }


    /* =========================
       MESSAGE BODY
    ========================= */

    .message-body {
      padding: 18px;
    }


    .message-body h2 {
      margin: 0 0 10px;
      font-size: 21px;
      line-height: 1.4;
    }


    .message-body p {
      margin: 0;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }


    /* =========================
       BUTTONS
    ========================= */

    .action-area {
      padding: 0 18px 18px;
    }


    .action-button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      margin-top: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }


    .apply-button {
      background: #06c755;
      color: white;
    }


    .contact-button {
      background: #eeeeee;
      color: #222;
    }


    .send-button {
      background: #111;
      color: white;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      margin: 15px auto;
      max-width: 560px;
      padding: 12px;
      border-radius: 10px;
      background: #fff;
      text-align: center;
      font-size: 14px;
      display: none;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }


      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }


      .select-card-content {
        padding: 11px;
      }


      .card-title {
        font-size: 15px;
      }


      .card-count {
        font-size: 12px;
      }


      .message-card {
        max-width: 100%;
      }

    }


    @media (max-width: 380px) {

      .grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <div class="header">

    <h1>🎴 Friend Card</h1>

    <p>
      เลือกการ์ดที่ต้องการส่ง
    </p>

  </div>


  <!-- =========================
       CARD LIST
  ========================= -->

  <main
    id="cardListScreen"
    class="container"
  >

    <div
      id="cardGrid"
      class="grid"
    ></div>

  </main>


  <!-- =========================
       PREVIEW
  ========================= -->

  <main
    id="previewScreen"
    class="container"
  >

    <button
      class="back-button"
      onclick="backToCards()"
    >
      ← กลับไปเลือกการ์ด
    </button>


    <div class="preview-title">
      Preview
    </div>


    <div
      id="previewCard"
      class="message-card"
    ></div>


    <div
      id="statusBox"
      class="status"
    ></div>

  </main>


  <script>


    /* ==================================================
       🖼️ รูปทั้งหมดอยู่ในโฟลเดอร์ images
       ================================================== */

    const IMAGE_FOLDER = "images";


    function getImageUrl(fileName) {

      return new URL(
        `${IMAGE_FOLDER}/${fileName}`,
        window.location.href
      ).href;

    }


    /* ==================================================
       🔢 ระบบนับจำนวน
       ================================================== */

    const COUNT_KEY =
      "friend_card_counts_v2";


    function getCounts() {

      try {

        return JSON.parse(
          localStorage.getItem(COUNT_KEY) || "{}"
        );

      } catch (error) {

        return {};

      }

    }


    function saveCounts(counts) {

      localStorage.setItem(
        COUNT_KEY,
        JSON.stringify(counts)
      );

    }


    function addCount(cardId, amount) {

      const counts =
        getCounts();


      counts[cardId] =
        Number(counts[cardId] || 0)
        + Number(amount);


      saveCounts(counts);

    }


    /* ==================================================
       🎴 แสดงการ์ด
       ================================================== */

    function renderCards() {

      const grid =
        document.getElementById(
          "cardGrid"
        );


      const counts =
        getCounts();


      grid.innerHTML = "";


      cards.forEach(card => {

        const count =
          Number(
            counts[card.id] || 0
          );


        const element =
          document.createElement("div");


        element.className =
          "select-card";


        element.innerHTML = `

          <img
            src="${getImageUrl(card.images[0])}"
            alt="Card ${card.id}"
          >

          <div class="select-card-content">

            <div class="card-number">
              CARD ${card.id}
            </div>

            <div class="card-title">
              ${escapeHtml(card.title)}
            </div>

            <div class="card-count">
              👥 ส่งแล้ว ${count} คน
            </div>

          </div>

        `;


        element.onclick =
          function() {

            openPreview(card.id);

          };


        grid.appendChild(element);

      });

    }


    /* ==================================================
       👀 Preview
       ================================================== */

    let selectedCardId =
      null;


    function openPreview(cardId) {

      selectedCardId =
        cardId;


      const card =
        cards.find(
          item =>
            item.id === cardId
        );


      if (!card) {

        alert(
          "ไม่พบข้อมูลการ์ด"
        );

        return;

      }


      document.getElementById(
        "cardListScreen"
      ).style.display = "none";


      document.getElementById(
        "previewScreen"
      ).style.display = "block";


      const preview =
        document.getElementById(
          "previewCard"
        );


      const imageClass =
        card.images.length >= 2
          ? "two"
          : "one";


      /* ----------------------------------------------
         รูปทั้งหมดใน Preview
         แตะรูป = ไป APPLY_URL
      ---------------------------------------------- */

      const imagesHtml =
        card.images
          .slice(0, 2)
          .map(image => {

            const imageUrl =
              getImageUrl(image);


            return `

              <a
                class="image-link"
                href="${APPLY_URL}"
                target="_blank"
              >

                <img
                  src="${imageUrl}"
                  alt=""
                >

              </a>

            `;

          })
          .join("");


      preview.innerHTML = `

        <div
          class="preview-images ${imageClass}"
        >

          ${imagesHtml}

        </div>


        <div class="message-body">

          <h2>
            ${escapeHtml(card.title)}
          </h2>

          <p>
            คุณกำลังดูตัวอย่างการ์ดที่จะส่งให้เพื่อน
          </p>

        </div>


        <div class="action-area">

          <a
            class="action-button apply-button"
            href="${APPLY_URL}"
            target="_blank"
          >
            สมัครสมาชิก
          </a>


          <a
            class="action-button contact-button"
            href="${CONTACT_URL}"
            target="_blank"
          >
            ติดต่อเรา
          </a>


          <button
            class="action-button send-button"
            onclick="sendCard()"
          >
            📤 ส่งการ์ดนี้
          </button>

        </div>

      `;


      hideStatus();

    }


    /* ==================================================
       ← กลับ
       ================================================== */

    function backToCards() {

      selectedCardId =
        null;


      document.getElementById(
        "previewScreen"
      ).style.display = "none";


      document.getElementById(
        "cardListScreen"
      ).style.display = "block";


      hideStatus();

    }


    /* ==================================================
       📤 ส่ง Flex Card
       ================================================== */

    async function sendCard() {

      if (!selectedCardId) {

        alert(
          "กรุณาเลือกการ์ดก่อน"
        );

        return;

      }


      const card =
        cards.find(
          item =>
            item.id === selectedCardId
        );


      if (!card) {

        alert(
          "ไม่พบข้อมูลการ์ด"
        );

        return;

      }


      try {

        showStatus(
          "กำลังเตรียมการส่ง..."
        );


        /* ----------------------------------------------
           ตรวจสอบ LIFF
        ---------------------------------------------- */

        if (
          !liff.isInClient() &&
          !liff.isLoggedIn()
        ) {

          liff.login();

          return;

        }


        /* ----------------------------------------------
           ตรวจสอบ Share Target Picker
        ---------------------------------------------- */

        if (
          !liff.isApiAvailable(
            "shareTargetPicker"
          )
        ) {

          hideStatus();

          alert(
            "อุปกรณ์หรือสภาพแวดล้อมนี้ไม่รองรับ Share Target Picker"
          );

          return;

        }


        /* ----------------------------------------------
           สร้าง Flex Message
        ---------------------------------------------- */

        const flexMessage =
          createFlexMessage(card);


        showStatus(
          "กำลังเปิดรายชื่อเพื่อน..."
        );


        /* ----------------------------------------------
           เปิด Share Target Picker
        ---------------------------------------------- */

        const result =
          await liff.shareTargetPicker(
            [
              flexMessage
            ]
          );


        hideStatus();


        /* ----------------------------------------------
           บันทึกจำนวนผู้รับ
        ---------------------------------------------- */

        if (
          result &&
          result.status === "success"
        ) {

          recordSentCount();

        }

        else {

          recordSentCount();

        }


      } catch (error) {

        console.error(
          "Share Target Picker Error:",
          error
        );


        hideStatus();


        alert(
          "ไม่สามารถส่งการ์ดได้\n\n" +
          "รายละเอียด: " +
          (error.message || error)
        );

      }

    }


    /* ==================================================
       🎴 สร้าง Flex Message
       
       1 รูป:
       - 1:1
       - เต็มความกว้าง
       - แตะรูป → APPLY_URL

       2 รูป:
       - 1:1 ทั้งคู่
       - เรียงบน-ล่าง
       - เต็มความกว้าง
       - แตะรูป → APPLY_URL
       ================================================== */

    function createFlexMessage(card) {

      const imageUrls =
        card.images
          .slice(0, 2)
          .map(image =>
            getImageUrl(image)
          );


      let hero;


      /* =========================
         1 รูป
         ========================= */

      if (
        imageUrls.length === 1
      ) {

        hero = {

          type: "image",

          url: imageUrls[0],

          size: "full",

          aspectRatio: "1:1",

          aspectMode: "cover",

          action: {

            type: "uri",

            uri: APPLY_URL

          }

        };

      }


      /* =========================
         2 รูป
         เรียงบน-ล่าง
         ========================= */

      else {

        hero = {

          type: "box",

          layout: "vertical",

          spacing: "none",

          contents:

            imageUrls.map(
              imageUrl => ({

                type: "image",

                url: imageUrl,

                size: "full",

                aspectRatio: "1:1",

                aspectMode: "cover",

                action: {

                  type: "uri",

                  uri: APPLY_URL

                }

              })
            )

        };

      }


      return {

        type: "flex",

        altText:
          card.title,

        contents: {

          type: "bubble",

          size: "mega",


          hero: hero,


          body: {

            type: "box",

            layout: "vertical",

            spacing: "md",

            paddingAll: "18px",

            contents: [

              {

                type: "text",

                text: card.title,

                weight: "bold",

                size: "xl",

                wrap: true

              }

            ]

          },


          footer: {

            type: "box",

            layout: "vertical",

            spacing: "sm",

            paddingAll: "16px",

            contents: [

              {

                type: "button",

                style: "primary",

                height: "sm",

                action: {

                  type: "uri",

                  label:
                    "สมัครสมาชิก",

                  uri:
                    APPLY_URL

                }

              },


              {

                type: "button",

                style: "secondary",

                height: "sm",

                action: {

                  type: "uri",

                  label:
                    "ติดต่อเรา",

                  uri:
                    CONTACT_URL

                }

              }

            ]

          }

        }

      };

    }


    /* ==================================================
       🔢 บันทึกจำนวนคน
       ================================================== */

    function recordSentCount() {

      const answer =
        prompt(

          "ส่งการ์ดนี้ให้กี่คน?\n\n" +
          "เช่น ถ้าเลือกเพื่อน 20 คน ให้ใส่ 20"

        );


      if (
        answer === null
      ) {

        alert(
          "ส่งการ์ดแล้ว แต่ยังไม่ได้บันทึกจำนวน"
        );

        return;

      }


      const amount =
        Number(
          String(answer).trim()
        );


      if (
        !Number.isInteger(amount) ||
        amount < 0
      ) {

        alert(
          "จำนวนไม่ถูกต้อง"
        );

        return;

      }


      addCount(
        selectedCardId,
        amount
      );


      renderCards();


      alert(
        "บันทึกแล้ว +" +
        amount +
        " คน"
      );

    }


    /* ==================================================
       🔤 ป้องกัน HTML
       ================================================== */

    function escapeHtml(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==================================================
       ℹ️ STATUS
       ================================================== */

    function showStatus(message) {

      const box =
        document.getElementById(
          "statusBox"
        );


      box.textContent =
        message;


      box.style.display =
        "block";

    }


    function hideStatus() {

      const box =
        document.getElementById(
          "statusBox"
        );


      box.style.display =
        "none";

    }


    /* ==================================================
       🚀 เริ่ม LIFF
       ================================================== */

    async function initLIFF() {

      try {

        await liff.init({

          liffId:
            LIFF_ID

        });


        console.log(
          "LIFF initialized"
        );


      } catch (error) {

        console.error(
          "LIFF initialization failed:",
          error
        );

      }

    }


    /* ==================================================
       🚀 เริ่มระบบ
       ================================================== */

    renderCards();

    initLIFF();

  </script>


</body>

</html>
